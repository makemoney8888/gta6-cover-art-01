<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viceprint — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="studio">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark">VP</span>
      <div>
        <h1>Viceprint</h1>
        <p>Cover Studio — turn your photos into GTA-style poster art</p>
      </div>
    </div>
    <p class="hint">Click a panel on the cover to pick it, then drag its photo to reposition it.</p>
  </header>

  <main class="workbench">
    <section class="preview-wrap">
      <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
      <p id="panelNote" class="panel-note" role="status">Panel 1 of 4 selected</p>
    </section>

    <aside class="panel">
      <section class="group">
        <h2>1 · Photos</h2>
        <div id="tray" class="tray" aria-label="Photos"></div>
        <label class="file-btn">Add your photos…
          <input id="addPhotos" type="file" accept="image/*" multiple hidden>
        </label>
        <button id="fillAll" type="button" class="ghost">Fill every panel with the selected photo</button>
      </section>

      <section class="group">
        <h2>2 · Layout</h2>
        <div id="layoutPicker" class="chips" role="group" aria-label="Layout"></div>
      </section>

      <section class="group">
        <h2>3 · Colour grade</h2>
        <div id="gradePicker" class="chips" role="group" aria-label="Colour grade"></div>
      </section>

      <section class="group">
        <h2>4 · Words</h2>
        <label>Kicker <input id="kicker" type="text" maxlength="32" value="WELCOME TO LEONIDA"></label>
        <label>Title line 1 <input id="title1" type="text" maxlength="24" value="SUNSET"></label>
        <label>Title line 2 <input id="title2" type="text" maxlength="24" value="HEIST"></label>
        <label>Script line <input id="script" type="text" maxlength="32" value="one last score"></label>
      </section>

      <section class="group">
        <h2>5 · Selected panel</h2>
        <label>Photo <select id="panelPhoto"></select></label>
        <label>Zoom <input id="panelZoom" type="range" min="1" max="2.4" step="0.01" value="1"></label>
        <button id="resetPanel" type="button" class="ghost">Reset this panel's photo position</button>
      </section>

      <section class="group export">
        <h2>6 · Export</h2>
        <label>Size
          <select id="exportSize">
            <option value="1080x1080">1080 × 1080 — square post</option>
            <option value="1080x1350">1080 × 1350 — portrait post</option>
            <option value="1920x1080">1920 × 1080 — wide post</option>
          </select>
        </label>
        <button id="exportBtn" type="button" class="primary">Export PNG</button>
        <p id="status" role="status"></p>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
